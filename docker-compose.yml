services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clothing_assistant
      POSTGRES_USER: clothing_assistant
      POSTGRES_PASSWORD: clothing_assistant
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clothing_assistant -d clothing_assistant"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://clothing_assistant:clothing_assistant@db:5432/clothing_assistant
      LANGGRAPH_CHECKPOINT_DATABASE_URL: postgresql://clothing_assistant:clothing_assistant@db:5432/clothing_assistant
      SESSION_CSRF_SECRET: ${SESSION_CSRF_SECRET:?Set SESSION_CSRF_SECRET in the local environment}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-60}
      SESSION_ABSOLUTE_HOURS: ${SESSION_ABSOLUTE_HOURS:-168}
      SESSION_TOUCH_INTERVAL_SECONDS: ${SESSION_TOUCH_INTERVAL_SECONDS:-300}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-lookeate_session}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      RATE_LIMIT_REDIS_URL: ${RATE_LIMIT_REDIS_URL:-redis://redis:6379/0}
      RATE_LIMIT_KEY_SECRET: ${RATE_LIMIT_KEY_SECRET:-development-rate-limit-key-secret-change-me}
      RATE_LIMIT_OPERATION_TIMEOUT_SECONDS: ${RATE_LIMIT_OPERATION_TIMEOUT_SECONDS:-0.25}
      TRUSTED_BFF_PROXY_HOSTS: ${TRUSTED_BFF_PROXY_HOSTS:-frontend}
      TRUSTED_BFF_SOURCE_HEADER: ${TRUSTED_BFF_SOURCE_HEADER:-x-lookeate-client-source}
      PROVIDER_READINESS_TIMEOUT_SECONDS: ${PROVIDER_READINESS_TIMEOUT_SECONDS:-5}
      GOOGLE_IMAGE_ANALYSIS_MODEL: ${GOOGLE_IMAGE_ANALYSIS_MODEL:-gemini-2.5-flash}
      GOOGLE_LLM_MODEL: ${GOOGLE_LLM_MODEL}
      GROQ_LLM_MODEL: ${GROQ_LLM_MODEL}
      GOOGLE_EMBEDDING_MODEL: ${GOOGLE_EMBEDDING_MODEL}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      LLM_SUB_AGENTS_PROVIDER: ${LLM_SUB_AGENTS_PROVIDER}
      LLM_SUPERVISOR_PROVIDER: ${LLM_SUPERVISOR_PROVIDER}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER}
      IMAGE_ANALYSIS_PROVIDER: ${IMAGE_ANALYSIS_PROVIDER:-google}
      IMAGE_SEARCH_MODE: ${IMAGE_SEARCH_MODE:-characteristics}
      IMAGE_VISUAL_SEARCH_CANDIDATE_LIMIT: ${IMAGE_VISUAL_SEARCH_CANDIDATE_LIMIT:-80}
      IMAGE_VISUAL_SEARCH_WEIGHT: ${IMAGE_VISUAL_SEARCH_WEIGHT:-10.0}
      IMAGE_VISUAL_SEARCH_FETCH_TIMEOUT_SECONDS: ${IMAGE_VISUAL_SEARCH_FETCH_TIMEOUT_SECONDS:-3.0}
      IMAGE_VISUAL_SEARCH_MAX_IMAGE_BYTES: ${IMAGE_VISUAL_SEARCH_MAX_IMAGE_BYTES:-5242880}
      INCLUDE_PROMPT_EXAMPLES: ${INCLUDE_PROMPT_EXAMPLES}
    ports:
      - "8000:8000"
    volumes:
      - business_knowledge_index:/app/data/business_knowledge_index

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile.dev
    depends_on:
      api:
        condition: service_started
    environment:
      API_BASE_URL: http://api:8000
      APP_ENV: ${APP_ENV:-local}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      CSP_MODE: ${CSP_MODE:-report-only}
      CSP_SOURCES: ${CSP_SOURCES:-'self'}
      CSP_REPORT_URI: ${CSP_REPORT_URI:-}
      TRUSTED_HTTPS_TERMINATION: ${TRUSTED_HTTPS_TERMINATION:-false}
      HSTS_MAX_AGE_SECONDS: ${HSTS_MAX_AGE_SECONDS:-300}
      TRUSTED_INGRESS_SOURCE_HEADER: ${TRUSTED_INGRESS_SOURCE_HEADER:-}
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./src/frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next

volumes:
  postgres_data:
  business_knowledge_index:
  frontend_node_modules:
  frontend_next_cache:
