name: lookeate-migrations-test

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: lookeate_migrations
      POSTGRES_USER: lookeate_test
      POSTGRES_PASSWORD: disposable_test_password
    ports:
      - target: 5432
        published: "0"
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lookeate_test -d lookeate_migrations"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    tmpfs:
      - /var/lib/postgresql/data
